name: Verify preserved BET results

on:
  push:
    branches: [main, rev2]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Check Make entry points without executing models
        run: python3 ci/check-make-entrypoints.py
      - name: Verify preserved assessment files
        run: python3 ci/verify-preserved-files.py
      - name: Check preserved inputs and results
        shell: bash
        run: |
          Rscript scripts/audit-assessment-values.R .
          Rscript scripts/audit-cross-references.R .
          python3 ci/verify-preserved-files.py
          git diff --exit-code

  native-fishery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Verify compact native source recipe
        run: python3 reproduce/restore.py --verify
      - name: Regenerate all eight original fishery-impact reports
        shell: bash
        run: |
          make verify
          unzip -q reproduce/figure66-standalone.zip -d "$RUNNER_TEMP/reader-kit"
          make --no-print-directory -C "$RUNNER_TEMP/reader-kit/bet-figure66-standalone" rerun CASE=all OUT="$RUNNER_TEMP/bet-fishery-impact"
          python3 ci/verify-preserved-files.py
          git diff --exit-code

      - name: Retain native reader checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figure66-native-checks
          path: |
            ${{ runner.temp }}/bet-fishery-impact/native-checks.csv
            ${{ runner.temp }}/bet-fishery-impact/*/native-check.csv
            ${{ runner.temp }}/bet-fishery-impact/*/mfcl-native.log
          retention-days: 14
          if-no-files-found: error
