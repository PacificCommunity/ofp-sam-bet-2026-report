name: Verify preserved BET results

on:
  push:
    branches: [rev2]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Verify preserved assessment files
        run: python3 ci/verify-preserved-files.py
      - name: Check preserved inputs and results
        shell: bash
        run: |
          Rscript scripts/audit-assessment-values.R .
          Rscript scripts/audit-cross-references.R .
          python3 ci/verify-preserved-files.py
          git diff --exit-code
