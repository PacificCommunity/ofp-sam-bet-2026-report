name: Verify preserved BET results

on:
  push:
    branches: [rev2]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Check Make entry points without executing models
        run: python3 ci/check-make-entrypoints.py
      - name: Verify preserved assessment files
        run: python3 ci/verify-preserved-files.py
      - name: Check preserved inputs and results
        shell: bash
        run: |
          Rscript scripts/audit-assessment-values.R .
          Rscript scripts/audit-cross-references.R .
          python3 ci/verify-preserved-files.py
          git diff --exit-code

  native-fishery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify compact native source recipe
        run: python3 reproduce/restore.py --verify
      - name: Regenerate all eight original fishery-impact reports
        shell: bash
        run: |
          make rerun CASE=all OUT="$RUNNER_TEMP/bet-fishery-impact"
          python3 ci/verify-preserved-files.py
          git diff --exit-code
