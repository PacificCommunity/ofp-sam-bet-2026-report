name: Render Quarto PDF

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "quarto/**"
      - ".github/pages/**"
      - ".github/workflows/render-quarto.yml"
  pull_request:
    paths:
      - "quarto/**"
      - ".github/pages/**"
      - ".github/workflows/render-quarto.yml"

permissions:
  contents: read

concurrency:
  group: render-quarto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    container:
      image: ghcr.io/pacificcommunity/tuna-flow-private:v2.7@sha256:4fee4c40cb6439ff920b1dd233a84bf19d5cc0e37278c99ceff3fd79cb9c8852
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Render report
        shell: bash
        working-directory: quarto
        run: |
          quarto --version
          pdflatex --version | head -n 1
          quarto render index.qmd --to pdf

      - name: Verify rendered PDF
        run: test -s quarto/_render/WCPFC-SC22-2026-SA-WP-06.pdf

      - name: Upload rendered PDF
        uses: actions/upload-artifact@v4
        with:
          name: WCPFC-SC22-2026-SA-WP-06
          path: quarto/_render/WCPFC-SC22-2026-SA-WP-06.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          install -d _pages
          install -m 0644 quarto/_render/WCPFC-SC22-2026-SA-WP-06.pdf _pages/WCPFC-SC22-2026-SA-WP-06.pdf
          install -m 0644 .github/pages/index.html _pages/index.html

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download rendered PDF
        uses: actions/download-artifact@v4
        with:
          name: WCPFC-SC22-2026-SA-WP-06
          path: release

      - name: Build Quarto source archive
        shell: bash
        run: |
          tar \
            --exclude='quarto/.quarto' \
            --exclude='quarto/_render' \
            -czf release/WCPFC-SC22-2026-SA-WP-06-quarto-source.tar.gz \
            quarto .github/workflows/render-quarto.yml

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/WCPFC-SC22-2026-SA-WP-06.pdf
            release/WCPFC-SC22-2026-SA-WP-06-quarto-source.tar.gz
