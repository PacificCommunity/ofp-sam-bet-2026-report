name: Render Quarto PDF

on:
  workflow_dispatch:
  push:
    branches: [rev2]
    paths:
      - "**.qmd"
      - "_quarto.yml"
      - "SCreport.cls"
      - "figures/**"
      - "figures_new/**"
      - "references/**"
      - "scripts/**"
      - "sections/**"
      - "sources/**"
      - "styles/**"
      - "tables/**"
      - "*.lua"
      - "WCPFC-SC22-2026-SA-WP-06.pdf"
      - ".github/pages/**"
      - ".github/workflows/render-quarto.yml"

permissions:
  contents: read

concurrency:
  group: render-quarto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pacificcommunity/tuna-flow-private:v2.7@sha256:4fee4c40cb6439ff920b1dd233a84bf19d5cc0e37278c99ceff3fd79cb9c8852
    timeout-minutes: 45
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned PDF verifier
        shell: bash
        run: |
          if ! python3 -m pip --version >/dev/null 2>&1; then
            apt-get update
            apt-get install --yes --no-install-recommends python3-pip
          fi
          python3 -m pip install --target /tmp/rev2-python PyMuPDF==1.28.2
          echo "PYTHONPATH=/tmp/rev2-python" >> "$GITHUB_ENV"

      - name: Verify the committed publication PDF
        shell: bash
        run: |
          python3 scripts/verify-rev2.py --output _render/committed-rev2-verification.json
          cp WCPFC-SC22-2026-SA-WP-06.pdf _render/committed-rev2.pdf

      - name: Render the frozen revision sources
        shell: bash
        run: |
          Rscript scripts/audit-cross-references.R .
          Rscript scripts/audit-assessment-values.R .
          quarto render main.qmd --to pdf
          python3 scripts/finalize-rev2-cover.py
          python3 scripts/verify-rev2.py --output _render/rebuilt-rev2-verification.json

      - name: Prepare the verified publication
        shell: bash
        run: |
          # Publish the exact checked-in PDF after validating the source rebuild.
          # No upstream synchronization or automatic commits are made in Rev.02.
          cp _render/committed-rev2.pdf WCPFC-SC22-2026-SA-WP-06.pdf
          install -d _pages
          install -m 0644 WCPFC-SC22-2026-SA-WP-06.pdf _pages/WCPFC-SC22-2026-SA-WP-06.pdf
          install -m 0644 .github/pages/index.html _pages/index.html

      - name: Upload report and verification records
        uses: actions/upload-artifact@v4
        with:
          name: WCPFC-SC22-2026-SA-WP06-Rev02
          path: |
            WCPFC-SC22-2026-SA-WP-06.pdf
            main.tex
            _render/*-rev2-verification.json
          if-no-files-found: error
          retention-days: 30

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    needs: render
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified Rev.02 PDF
        id: deployment
        uses: actions/deploy-pages@v4
